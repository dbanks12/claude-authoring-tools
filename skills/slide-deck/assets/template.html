<title>Slides</title>
<style>
  :root{
    --bg:#e8e7ea; --ink:#121118; --muted:#6b6875; --line:#cfccd8;
    --acc:#6f5fd8; --pop:#d05a2e; --red:#d62828; --green:#2b8a3e; --card:#f7f6f9; --chipbg:#dbd6f2;
    --chev:url('data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20900%201080%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23d8d3ef%22%20stroke-width%3D%22150%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M%20700%20-140%20L%20260%20540%20L%20700%201220%22/%3E%3Cpath%20d%3D%22M%201060%20-140%20L%20620%20540%20L%201060%201220%22/%3E%3C/g%3E%3C/svg%3E');
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16151b; --ink:#eceaf2; --muted:#9a97a8; --line:#363344;
      --acc:#B0A6FF; --pop:#ED7A4F; --red:#ff6b6b; --green:#69db7c; --card:#1f1e26; --chipbg:#2b2838;
      --chev:url('data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20900%201080%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23232030%22%20stroke-width%3D%22150%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M%20700%20-140%20L%20260%20540%20L%20700%201220%22/%3E%3Cpath%20d%3D%22M%201060%20-140%20L%20620%20540%20L%201060%201220%22/%3E%3C/g%3E%3C/svg%3E');
    }
  }
  :root[data-theme="dark"]{
    --bg:#16151b; --ink:#eceaf2; --muted:#9a97a8; --line:#363344;
    --acc:#B0A6FF; --pop:#ED7A4F; --red:#ff6b6b; --green:#69db7c; --card:#1f1e26; --chipbg:#2b2838;
    --chev:url('data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20900%201080%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23232030%22%20stroke-width%3D%22150%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M%20700%20-140%20L%20260%20540%20L%20700%201220%22/%3E%3Cpath%20d%3D%22M%201060%20-140%20L%20620%20540%20L%201060%201220%22/%3E%3C/g%3E%3C/svg%3E');
  }
  
  body{background:var(--bg); color:var(--ink); font-family:Arial,"Helvetica Neue",sans-serif; margin:0; line-height:1.5;}
  .slide{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:48px clamp(24px,8vw,120px); box-sizing:border-box; border-bottom:1px solid var(--line); position:relative; overflow:hidden;}
  .slide::before{content:""; position:absolute; top:0; bottom:0; right:0; width:60%; background-image:var(--chev); background-repeat:no-repeat; background-position:left center; background-size:cover; pointer-events:none;}
  .inner{max-width:880px; position:relative; z-index:1;}
  .title{font-size:clamp(36px,5.5vw,64px); line-height:1.05; margin:0 0 12px; letter-spacing:-.02em; color:var(--acc); font-weight:700; text-wrap:balance;}
  .sub{font-size:clamp(19px,2.4vw,26px); font-weight:700; margin:0 0 20px; text-wrap:balance; max-width:34ch;}
  p{font-size:18px; max-width:62ch; margin:0 0 12px;}
  .muted{color:var(--muted);}
  ul{margin:8px 0 0; padding-left:0; list-style:none; max-width:70ch;}
  li{font-size:17px; padding:9px 0; border-top:1px solid var(--line);}
  li:first-child{border-top:none;}
  ul.plain{list-style:disc; padding-left:1.3em;}
  ul.plain li{border-top:none; padding:4px 0;}
  li b{font-weight:700;}
  .inner.wide{max-width:1200px;}
  .split{display:grid; column-gap:64px; align-items:start; margin-top:8px;}
  .split .col > :first-child{margin-top:0;}
  .split{margin-top:4px;}
  .split .sub{margin-bottom:20px;}
  li ul{margin:2px 0 0; padding-left:1.3em; list-style:circle;}
  li li, ul.plain li li{font-size:15px; padding:2px 0; border-top:none;}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.92em; color:var(--acc);}
  .cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:18px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
  .card h3{margin:0 0 6px; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:var(--acc);}
  .card p{font-size:15px; margin:0;}
  .chip{position:absolute; right:clamp(24px,6vw,80px); bottom:28px; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; letter-spacing:.08em; background:var(--chipbg); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:6px 14px;}
  .chip b{color:var(--acc); font-weight:700;}
  .num{position:absolute; top:26px; right:clamp(24px,6vw,80px); font-family:ui-monospace,Menlo,monospace; font-size:12.5px; color:var(--muted);}
  .sig{font-family:ui-monospace,Menlo,monospace; font-size:15px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin-top:16px; overflow-x:auto; white-space:pre; line-height:1.7;}
  .kicker{color:var(--pop); font-weight:700;}
  .red{color:var(--red);}
  .green{color:var(--green);}
  a{color:var(--acc);}
  .fig{margin:22px 0 0; background:#ffffff; border:1px solid var(--line); border-radius:10px; padding:6px; width:fit-content; max-width:100%; box-sizing:border-box;}
  .fig img{display:block; width:auto; max-width:100%; height:auto; max-height:34vh;}
  /* fill (default): the slide is exactly one screen and the figure takes whatever height is left */
  .slide.top{justify-content:flex-start;}  /* titles: top */
  .slide.hasfill{height:100vh;}
  .slide.hasfill .inner{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; max-width:none; width:100%;}
  .fig.fill{flex:1 1 0; min-height:0; margin:14px 0 0; padding:0; border:none; background:none; width:100%;}
  .fig.fill img{max-width:100%; max-height:100%; background:#ffffff; border:1px solid var(--line); border-radius:10px; padding:6px; box-sizing:border-box;}
  .slide.hasfill .split{flex:1 1 auto; min-height:0; align-items:stretch;}
  .slide.hasfill .split .col{display:flex; flex-direction:column; min-height:0;}
  /* mega: flush to the top, bottom and right edges; text keeps the usual left margin */
  .slide.hasmega{padding-top:0; padding-bottom:0; padding-right:0;}
  .slide.hasmega .num{display:none;}
  .slide.hasmega .split{margin-top:0;}
  .slide.hasmega .split .col:first-child{padding-top:48px;}
  .fig.mega{margin:0;}
  .fig.mega img{border:none; border-radius:0; padding:0; margin-left:auto;}  /* hug the right edge when height runs out first */
  @media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth;} }
</style>

<!--SLIDES-->


<script>
  const slides = [...document.querySelectorAll('.slide')];
  let settled = 0, animating = false, timer = null;
  function goTo(i){
    settled = Math.max(0, Math.min(i, slides.length - 1));
    animating = true;
    window.scrollTo({ top: slides[settled].offsetTop, behavior: 'smooth' });
  }
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const fwd = e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === 'j' || e.key === ' ';
    const back = e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'k';
    if (!fwd && !back) return;
    goTo(settled + (fwd ? 1 : -1));
    e.preventDefault();
    e.stopPropagation();
  }, true);
  addEventListener('scroll', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (animating) { animating = false; return; }
      const y = window.scrollY;
      let nearest = 0, best = Infinity;
      slides.forEach((el, i) => {
        const d = Math.abs(el.offsetTop - y);
        if (d < best) { best = d; nearest = i; }
      });
      const delta = y - slides[settled].offsetTop;
      if (nearest !== settled) goTo(nearest);
      else if (delta > 40) goTo(settled + 1);
      else if (delta < -40) goTo(settled - 1);
      else if (Math.abs(delta) > 2) goTo(settled);
    }, 160);
  }, { passive: true });
</script>
